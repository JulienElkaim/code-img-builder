# LOCAL mode: builds the image from ./image and runs it.
#   podman compose -f docker-compose.local.yaml build
#   podman compose -f docker-compose.local.yaml run --rm asteroid-code
services:
  asteroid-code:
    image: asteroid-code:local
    build:
      context: ./image
      args:
        BASE_REPO: ${BASE_REPO:?Set BASE_REPO in .env}
        NPM_REGISTRY: ${NPM_REGISTRY:?Set NPM_REGISTRY in .env}
        APT_REPO: ${APT_REPO:?Set APT_REPO in .env}
        APT_SECURITY_REPO: ${APT_SECURITY_REPO:?Set APT_SECURITY_REPO in .env}
    working_dir: /workspace
    stdin_open: true
    tty: true
    environment:
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
    volumes:
      - type: bind          # long form: "C:/..." paths break the short "a:b" form
        source: ${DEV_DIR:-./dev}
        target: /workspace
      - type: bind          # your personal Pi files: sessions, AGENTS.md, skills/, prompts/, mcp.json
        source: ${DATA_DIR:-./data}
        target: /home/node/.asteroid-code
